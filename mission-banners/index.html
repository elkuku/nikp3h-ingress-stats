/* Layout: a summary strip, filter bar, then a ledger of banner cards; each card compares your medal rows with the Bannergress picture. */
:root{
  --hh:56px;
  --bg:#0b100f; --surface:#131b19; --fg:#e4ece9; --muted:#8fa19b; --line:#24312d;
  --enl:#3ad19a; --res:#5aa2ff; --warn:#e3a53b; --none:#e07a7a; --chip:#1b2623; --hover:#18221f; --openbg:#101716; --sea:#070b0a; --land:#16201d; --border:#2a3833;
  --display:"Chakra Petch",system-ui,sans-serif; --body:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:dark;
}
.mapbox{display:grid;gap:8px}
#map{height:clamp(320px,55vh,560px);border:1px solid var(--line);border-radius:8px;background:var(--sea)}
.leaflet-container{font-family:var(--body);background:var(--sea)}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--surface);color:var(--fg);box-shadow:0 4px 18px rgba(0,0,0,.5)}
.leaflet-popup-content{margin:10px 14px;font-size:13px;line-height:1.4}
.leaflet-popup-content b{font-family:var(--display);font-size:14px}
.leaflet-popup-content button{margin-top:6px;font:600 12px var(--body);color:var(--res);background:none;border:0;padding:0;cursor:pointer}
.leaflet-bar a{background:var(--surface);color:var(--fg);border-bottom-color:var(--line)}
.leaflet-bar a:hover{background:var(--hover)}
.leaflet-control-attribution{background:rgba(11,16,15,.7)!important;color:var(--muted)}
.leaflet-control-attribution a{color:var(--muted)}
.regions{display:flex;flex-wrap:wrap;gap:6px}
.facts button{font:inherit;color:var(--res);background:none;border:0;padding:0;cursor:pointer}
body{background:var(--bg);color:var(--fg);font-family:var(--body);line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-block:calc(var(--hh) + env(safe-area-inset-top,0px) + 20px) 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:24px}
.top{position:fixed;inset:0 0 auto;z-index:1000;background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top-in{max-width:1180px;margin:0 auto;height:var(--hh);display:flex;align-items:center;gap:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-family:var(--display);font-weight:700;font-size:22px;line-height:1;margin:0}
h1 span{background:linear-gradient(90deg,var(--enl),var(--res));-webkit-background-clip:text;background-clip:text;color:transparent}
#map{isolation:isolate;scroll-margin-top:calc(var(--hh) + env(safe-area-inset-top,0px) + 12px)}
.stats{margin-left:auto;display:flex;gap:18px;font-variant-numeric:tabular-nums;white-space:nowrap}
.stats div{display:flex;align-items:baseline;gap:6px}
.stats b{font-family:var(--display);font-size:18px;font-weight:700}
.stats small{color:var(--muted);font:12px var(--mono);text-transform:uppercase;letter-spacing:.06em}
h1{white-space:nowrap}
@media (max-width:480px){h1{font-size:18px}.stats{gap:10px}.stats b{font-size:15px}.stats small{font-size:10px;letter-spacing:.03em}}
@media (max-width:380px){h1{font-size:16px}.top-in{gap:10px}.stats{gap:8px}.stats div{gap:4px}.stats b{font-size:14px}.stats small{font-size:9px;letter-spacing:.02em}}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;position:sticky;top:calc(var(--hh) + env(safe-area-inset-top,0px));z-index:900;background:var(--bg);padding-block:10px;border-bottom:1px solid var(--line)}
.bar input{flex:1 1 220px;min-width:0;font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:500 13px var(--body);padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--chip);color:var(--fg);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip:focus-visible,.bar input:focus-visible,a:focus-visible{outline:2px solid var(--res);outline-offset:2px}
.count{font-family:var(--mono);font-size:13px;color:var(--muted)}
.list{display:grid;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.row{display:grid;grid-template-columns:3ch 48px minmax(0,1fr) auto;gap:6px 14px;align-items:center;padding:6px 12px 6px 9px;border-top:1px solid var(--line);border-left:3px solid var(--st);min-width:0}
.row:first-child{border-top:0}
.row{cursor:pointer;transition:background-color .12s}
.row:hover{background:var(--hover)}
.row.open{background:var(--openbg);cursor:default}
.row.open .info,.row.open .num,.row.open .thumb{cursor:pointer}
.row:hover h2{color:var(--res)}
@media (prefers-reduced-motion:reduce){.row{transition:none}}
.row[data-s="match"]{--st:var(--enl)} .row[data-s="likely"]{--st:var(--warn)} .row[data-s="none"]{--st:var(--none)}
.num{font:700 17px var(--display);text-align:right;font-variant-numeric:tabular-nums}
.thumb{padding:0;border:0;background:#000;border-radius:4px;cursor:zoom-in;width:48px;height:48px;display:block}
.thumb img{width:100%;height:100%;object-fit:contain;display:block}
.row.open .thumb{cursor:zoom-out}
.more{grid-column:2/-1;display:grid;grid-template-columns:minmax(0,440px) minmax(0,1fr);gap:12px 20px;align-items:start;padding-block:6px 4px}
.full{width:100%;display:block;border-radius:4px;background:#000;cursor:zoom-out}
.desc{margin:0;white-space:pre-line;font-size:14px;max-width:65ch;overflow-wrap:anywhere}
.facts{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:10px 0 0;font-size:13px;font-variant-numeric:tabular-nums}
.facts dt{color:var(--muted)} .facts dd{margin:0}
.facts a{color:var(--res)}
.warn{color:var(--warn)}
@media (max-width:760px){.more{grid-column:1/-1;grid-template-columns:minmax(0,1fr)}}
.info{min-width:0}
.info h2{font-family:var(--display);font-size:15px;font-weight:700;margin:0;line-height:1.25;overflow-wrap:anywhere}
.meta{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.side{display:flex;align-items:center;gap:12px;justify-content:flex-end}
.pill{font:500 10.5px var(--mono);text-transform:uppercase;letter-spacing:.06em;padding:2px 7px;border-radius:4px;white-space:nowrap;color:var(--st);border:1px solid var(--st)}
.side a{color:var(--res);font-size:13px;font-weight:600;text-decoration:none;white-space:nowrap}
.side a:hover{text-decoration:underline}
@media (max-width:640px){
  .row{grid-template-columns:3ch 48px minmax(0,1fr)}
  .side{grid-column:3;justify-content:flex-start}
}
</style>

<body>

<header class="top"><div class="top-in"><h1>nikp3h's <span>Banners</span></h1><div class="stats" id="stats"></div></div></header>
<div class="wrap">
  <section class="mapbox" aria-label="Map of banner start points">
    <div id="map"></div>
    <div class="regions" id="regions"></div>
  </section>
  <div class="bar">
    <input id="q" type="search" placeholder="Search title or place" aria-label="Search banners">
    <div class="chips" role="group" aria-label="Filter">
      <button class="chip" id="f-all" data-f="all" aria-pressed="true">All</button>
      <button class="chip" id="f-match" data-f="match" aria-pressed="false">Found</button>
      <button class="chip" id="f-likely" data-f="likely" aria-pressed="false">Probable</button>
      <button class="chip" id="f-none" data-f="none" aria-pressed="false">Not found</button>
    </div>
    <span class="count" id="count"></span>
  </div>
  <main class="list" id="list"></main>
</div>
<script src="data.js"></script>
<script src="world.js"></script>
<script>
const items=window.BANNERS;
const LABEL={likely:'Probable',none:'Not found'};
const dur=m=>m>=60?`${Math.floor(m/60)} h ${m%60} min`:`${m} min`;
const ORDER={sequential:'In order',anyOrder:'Any order'};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
document.getElementById('stats').innerHTML=[
  [items.length,'banners'],[items.reduce((a,i)=>a+i.count,0),'missions']
].map(([n,l])=>`<div><b>${n.toLocaleString()}</b><small>${l}</small></div>`).join('');
let filter='all';
function render(){
  const q=document.getElementById('q').value.trim().toLowerCase();
  const shown=items.filter(i=>(filter==='all'||i.status===filter)&&(!q||[i.name,i.title,i.addr,i.desc].join(' ').toLowerCase().includes(q)));
  document.getElementById('count').textContent=`${shown.length} shown`;
  document.getElementById('list').innerHTML=shown.map(i=>`
  <article class="row" id="b${items.indexOf(i)}" data-s="${i.status}" data-i="${items.indexOf(i)}">
    <span class="num">${i.missions||i.count}</span>
    <button class="thumb" type="button" aria-expanded="false" aria-label="Show the medals of ${esc(i.title||i.name)}"><img src="${i.img}" alt="" loading="lazy"></button>
    <div class="info"><h2>${esc(i.title||i.name)}</h2>
      <div class="meta">${i.addr?[esc(i.addr),i.km+' km',i.dur?'≈ '+dur(i.dur):'',ORDER[i.order]].filter(Boolean).join(' · ')+(i.disabled?` · <span class="warn">${i.disabled} disabled</span>`:''):'In Ingress: '+esc(i.name)}</div></div>
    <div class="side">${LABEL[i.status]?`<span class="pill">${LABEL[i.status]}</span>`:''}${i.id?`<a href="https://bannergress.com/banner/${encodeURIComponent(i.id)}" target="_blank" rel="noopener">Bannergress ↗</a>`:''}</div>
  </article>`).join('');
}
document.getElementById('list').addEventListener('click',e=>{
  if(e.target.closest('a')) return;
  const mb=e.target.closest('[data-map]'); if(mb){showBanner(+mb.dataset.map);return}
  const row=e.target.closest('.row'); if(!row) return;
  if(row.classList.contains('open') && e.target.closest('.more') && !e.target.closest('.full')) return;
  if(getSelection().toString()) return;
  const btn=row.querySelector('.thumb');
  const open=row.classList.toggle('open'); btn.setAttribute('aria-expanded',open);
  if(open){
    const i=items[+row.dataset.i], d=document.createElement('div'); d.className='more';
    const facts=[['Place',esc(i.addr)],['Missions',i.missions],['Length',i.km+' km'],['Duration',i.dur?'≈ '+dur(i.dur)+' (average)':''],
      ['Order',ORDER[i.order]],['Disabled',i.disabled?`<span class="warn">${i.disabled} of ${i.missions}</span>`:''],
      ['Event',i.event?esc(i.event.filter(Boolean).join(' – ')):''],['Offline',i.offline?`<span class="warn">${esc(i.offline)}</span>`:''],
      ['Map',i.lat!=null?`<button type="button" data-map="${row.dataset.i}">Show on the map</button>`:''],['Start',i.lat!=null?`<a href="https://www.google.com/maps/search/?api=1&query=${i.lat},${i.lng}" target="_blank" rel="noopener">${i.lat.toFixed(5)}, ${i.lng.toFixed(5)} ↗</a>`:'']]
      .filter(([,v])=>v);
    d.innerHTML=`<img class="full" src="${btn.querySelector('img').src}" alt="Your medals">
      <div>${i.warning?`<p class="desc warn">${esc(i.warning)}</p>`:''}${i.desc?`<p class="desc">${esc(i.desc)}</p>`:i.id?'':'<p class="desc">This banner was not found on Bannergress.</p>'}
      ${i.id?`<dl class="facts">${facts.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>`:''}</div>`;
    row.append(d);
  } else row.querySelector('.more')?.remove();
});
document.querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.f;document.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',c===b));render()}));
document.getElementById('q').addEventListener('input',render);
render();

// Map
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const world=window.WORLD;
const map=L.map('map',{preferCanvas:true,worldCopyJump:true,maxZoom:16,minZoom:2,zoomSnap:.5});
map.attributionControl.setPrefix(false);
map.attributionControl.addAttribution('Banners: Bannergress');
const starts=items.map((b,bi)=>[b,bi]).filter(([b])=>b.lat!=null);
const all=L.latLngBounds(starts.map(([b])=>[b.lat,b.lng]));
map.fitBounds(all,{padding:[20,20]});
map.createPane('base').style.zIndex=150;
// Esri's dark canvas works without an API key and, unlike OpenStreetMap's tile servers, also from a file:// page.
const esri='https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/';
const tiles=[
  L.tileLayer(esri+'World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}',{maxZoom:16,maxNativeZoom:16,
    attribution:'Tiles © Esri, HERE, Garmin, © OpenStreetMap contributors'}),
  L.tileLayer(esri+'World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}',{maxZoom:16,maxNativeZoom:16})
];
for(const t of tiles){
  t.addTo(map);
  // A tile server sometimes drops a request; retry each failed tile a few times.
  t.on('tileerror',({tile,coords})=>{
    const n=+(tile.dataset.retry||0);
    if(n>=3) return;
    tile.dataset.retry=n+1;
    setTimeout(()=>{tile.src=t.getTileUrl(coords)+'?retry='+(n+1)},1500*(n+1));
  });
}
L.geoJSON(topojson.feature(world,world.objects.countries),{pane:'base',interactive:false,style:{color:css('--border'),weight:.8,fillColor:css('--land'),fillOpacity:1}}).addTo(map);
for(const [b,bi] of starts){
  const c=b.status==='likely'?css('--warn'):css('--enl');
  L.circleMarker([b.lat,b.lng],{radius:Math.min(11,4+Math.sqrt(b.missions)/1.6),weight:1.5,color:c,fillColor:c,fillOpacity:.45})
   .bindPopup(`<b>${esc(b.title)}</b><br>${b.missions} missions · ${esc(b.addr)}<br><button type="button" data-row="${bi}">Show in the list</button>`)
   .addTo(map);
}
document.getElementById('map').addEventListener('click',e=>{
  const b=e.target.closest('[data-row]'); if(!b) return;
  const bi=+b.dataset.row;
  if(!document.getElementById('b'+bi)){filter='all';document.getElementById('q').value='';document.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',c.dataset.f==='all'));render()}
  const row=document.getElementById('b'+bi);
  if(!row.classList.contains('open')) row.click();
  row.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'center'});
});
function showBanner(bi){
  map.setView([items[bi].lat,items[bi].lng],14);
  document.getElementById('map').scrollIntoView({behavior:'smooth',block:'start'});
}
// region shortcuts by country
const regions={};
for(const [b] of starts){ const c=(b.addr||'').split(',').pop().trim(); (regions[c]??=[]).push([b.lat,b.lng]); }
const rb=document.getElementById('regions');
const mk=(label,bounds)=>{const x=document.createElement('button');x.className='chip';x.type='button';x.textContent=label;x.addEventListener('click',()=>map.fitBounds(bounds,{padding:[30,30],maxZoom:15}));rb.append(x)};
mk('All',all);
Object.entries(regions).sort((a,b)=>b[1].length-a[1].length).forEach(([c,p])=>mk(`${c} · ${p.length}`,L.latLngBounds(p)));
</script>

</body>
