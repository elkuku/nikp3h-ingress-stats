<header class="top"><div class="top-in"><h1>nikp3h's <span>Banners</span></h1><div class="stats" id="stats"></div></div></header>
<div class="wrap">
  <section class="shotbox" aria-label="Mission medal screenshot">
    <h2>Mission medals in Ingress</h2>
    <p>The agent's mission medals, newest first. Select a banner here or in the table.</p>
    <div class="shot" id="shot"><div class="shot-in" id="shotIn"></div></div>
  </section>
  <section class="tablebox" aria-label="Banners">
    <div class="mapbox" aria-label="Map of banner start points">
      <h2>Start points</h2>
      <div id="map"></div>
      <div class="regions" id="regions"></div>
    </div>

    <div class="bar">
      <input id="q" type="search" placeholder="Search title, place, id or note" aria-label="Search banners">
      <span class="count" id="count"></span>
    </div>
    <div class="chips" id="chips" role="group" aria-label="Filter by analysis"></div>
    <div class="scroller" id="scroller">
      <table>
        <thead><tr id="head"></tr></thead>
        <tbody id="body"></tbody>
      </table>
    </div>
  </section>
